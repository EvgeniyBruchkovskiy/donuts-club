name: DonutsPost
options:
  bundleIdPrefix: ua.kr.donutsclub
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: uk
settings:
  base:
    DEVELOPMENT_TEAM: J9LW2QV3T6
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  DonutsPost:
    type: application
    platform: iOS
    sources: [DonutsPost]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ua.kr.donutsclub.post
        INFOPLIST_KEY_CFBundleDisplayName: Donuts Post
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Щоб обрати фото та відео для публікації.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
